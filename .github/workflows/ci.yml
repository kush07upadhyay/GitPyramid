name: CI

# Runs on the pull request event only, never on pull_request_target, so code from a fork never runs
# with this repository's secrets or a write token. Third-party actions are pinned to a full commit
# SHA, and each comment names the release that SHA belongs to.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint, typecheck, tests and registry validation. The same command contributors run locally.
      - name: Check
        run: pnpm check

  pr-rules:
    name: pr-rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Event values reach the shell through env, never by pasting ${{ }} into the script, so a
      # branch name or title cannot become a command.
      - name: Pull request rules
        env:
          BASE_REF: origin/${{ github.base_ref }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: pnpm exec tsx tools/pr-guard.ts

      # Asks GitHub whether each changed brick is public, not archived, still the same repository
      # and has the stated license. Network trouble is a warning, never a failure.
      - name: Check changed bricks against GitHub
        if: ${{ !cancelled() }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm validate --online --changed-since "$BASE_REF" --format github
