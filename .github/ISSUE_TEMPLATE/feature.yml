name: Feature request
description: Propose an improvement. Large ideas are welcome, please explain the problem first.
title: "Feature: "
labels: ["type/feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help build it?
      options:
        - Yes, I can build it
        - Yes, I can help test or design
        - No, I am only suggesting
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Sponsorship ideas never change bricks, scores or rankings. See the
        [constitution](https://github.com/kush07upadhyay/GitPyramid/blob/main/.specify/memory/constitution.md).
